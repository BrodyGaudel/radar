spring.application.name=radar-query-service

#DATABASE CONFIGURATION
spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PWD:admin}
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${DATABASE:queries_radar_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}

#AXON CONFIGURATION
axon.serializer.events=jackson
axon.serializer.messages=xstream
axon.serializer.general=jackson
axon.axonserver.enabled=true
axon.axonserver.servers=${AXON_HOST:localhost}:${AXON_PORT:8124}
axon.axonserver.event-store.enabled=true
axoniq.console.application-name=radar-query-service
axoniq.console.credentials=${AXON_CONSOLE:a056ccf1-0:a5d547ca355e44c09eb4ff6c1edcf33d}
axoniq.console.dlq-mode=NONE

#SERVER CONFIGURATION
server.port=8885
server.servlet.context-path=/radar

#SPRING CLOUD CONFIGURATION
eureka.instance.preferIpAddress=true
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE:http://localhost:8761/eureka/}